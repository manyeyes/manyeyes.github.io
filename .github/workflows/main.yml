name: Deploy manyspeech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./manyspeech
        run: npm ci

      - name: Build Rspress site
        working-directory: ./manyspeech
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manyspeech/doc_build   # 直接指向构建输出目录
          publish_branch: gh-pages
          destination_dir: manyspeech           # 关键：将所有文件放入 manyspeech/ 子目录
          keep_files: false                     # 清空旧文件，确保全新部署
