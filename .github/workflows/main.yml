name: Deploy manyspeech to GitHub Pages

on:
  push:
    branches: [main]          # 当 main 分支有推送时触发
  workflow_dispatch:          # 允许手动触发

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: manyspeech/package-lock.json   # 若使用 npm

      - name: Install dependencies
        working-directory: ./manyspeech
        run: npm ci

      - name: Build Rspress site
        working-directory: ./manyspeech
        run: npm run build
        # 默认构建产物输出到 manyspeech/doc_build/

      - name: Prepare deployment directory
        run: |
          # 创建 docs/manyspeech 文件夹（如果不存在）
          mkdir -p docs/manyspeech
          # 将构建产物复制到 docs/manyspeech 中
          cp -r manyspeech/doc_build/* docs/manyspeech/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs          # 将 docs 目录下的内容发布到 gh-pages 分支
          publish_branch: gh-pages     # 目标分支
          # 如果不希望保留历史提交，可以添加：
          # keep_files: false
