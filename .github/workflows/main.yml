name: Deploy manyspeech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不配置 cache

      - name: Install dependencies
        working-directory: ./manyspeech
        run: npm ci   # 如果项目没有 package-lock.json 则用 npm install

      - name: Build
        working-directory: ./manyspeech
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p docs/manyspeech
          cp -r manyspeech/doc_build/* docs/manyspeech/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
