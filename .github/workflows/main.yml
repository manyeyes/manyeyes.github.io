name: Deploy multiple projects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 构建 manyspeech 项目
      - name: Build manyspeech
        run: |
          cd manyspeech
          npm ci
          npm run build
          npm run export:docs
          mkdir -p ../docs/manyspeech
          cp -r doc_build/* ../docs/manyspeech/
          cp -r exports ../docs/manyspeech/exports
      
      # 创建根目录导航页
      - name: Create landing page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>文档中心</title>
              <style>
                  body {
                      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                      max-width: 800px;
                      margin: 0 auto;
                      padding: 2rem;
                      line-height: 1.5;
                  }
                  h1 { margin-bottom: 1rem; }
                  ul { list-style: none; padding: 0; }
                  li { margin: 1rem 0; }
                  a { font-size: 1.2rem; text-decoration: none; color: #0366d6; }
                  a:hover { text-decoration: underline; }
                  .desc { color: #586069; margin-top: 0.25rem; font-size: 0.9rem; }
              </style>
          </head>
          <body>
              <h1>📚 文档中心</h1>
              <p>欢迎访问，请选择项目：</p>
              <ul>
                  <li>
                      <a href="/manyspeech/">ManySpeech</a>
                      <div class="desc">轻量化本地语音识别工具，支持离线识别、实时流式识别。</div>
                  </li>
              </ul>
          </body>
          </html>
          EOF
      
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
