name: Deploy multiple projects

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 构建项目（manyspeech）
      - name: Build project A
        run: |
          cd manyspeech
          npm ci
          npm run build
          mkdir -p ../docs/manyspeech
          cp -r doc_build/* ../docs/manyspeech/
      
      # 可选：创建根目录导航页
      - name: Create landing page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>文档中心</title></head>
          <body>
            <h1>文档中心</h1>
            <ul>
              <li><a href="/manyspeech/">ManySpeech-CLI</a></li>
              <li><a href="/other-tool/">Other Tool</a></li>
            </ul>
          </body>
          </html>
          EOF
      
      # 部署到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
